[project]
name = "nanogpt"
version = "0.1.0"
description = "A small GPT training implementation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=4,<5",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    "tiktoken>=0.8,<1",
    "tokenizers>=0.21,<0.24",
    "torch>=2.6,<3",
    "tqdm>=4.67,<5",
    "transformers>=4.48,<5",
    "wandb>=0.19,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.6,<3"]
cu128 = ["torch>=2.6,<3"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
